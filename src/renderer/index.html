<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CheatGuard - 主窗口</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111827;
      color: #e5e7eb;
      min-height: 100vh;
      padding: 32px;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    
    header {
      margin-bottom: 32px;
    }
    
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    
    .subtitle {
      color: #9ca3af;
      font-size: 16px;
    }
    
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 32px;
    }
    
    .card {
      background: #1f2937;
      border-radius: 12px;
      padding: 24px;
    }
    
    .card h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    
    .status-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #374151;
    }
    
    .status-item:last-child {
      border-bottom: none;
    }
    
    .status-label {
      color: #9ca3af;
      font-size: 14px;
    }
    
    .status-badge {
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
    }
    
    .status-badge.success {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
    }
    
    .status-badge.info {
      background: rgba(59, 130, 246, 0.2);
      color: #3b82f6;
    }
    
    .shortcuts {
      background: #1f2937;
      border-radius: 12px;
      padding: 24px;
    }
    
    .shortcuts h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    
    .shortcut-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    
    .shortcut-item {
      background: #374151;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }
    
    .shortcut-key {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      background: #4b5563;
      padding: 4px 8px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 8px;
    }
    
    .shortcut-desc {
      font-size: 13px;
      color: #9ca3af;
    }
    
    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
      
      .shortcut-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>CheatGuard</h1>
      <p class="subtitle">实时 AI 桌面助手 - 隐形覆盖层</p>
    </header>
    
    <div class="grid">
      <div class="card">
        <h2>状态</h2>
        <div class="status-item">
          <span class="status-label">覆盖层</span>
          <span class="status-badge success">运行中</span>
        </div>
        <div class="status-item">
          <span class="status-label">快捷键</span>
          <span class="status-badge info">Cmd/Ctrl+Enter</span>
        </div>
        <div class="status-item">
          <span class="status-label">隐形模式</span>
          <span class="status-badge success">已启用</span>
        </div>
      </div>
      
      <div class="card">
        <h2>设置</h2>
        <div class="status-item">
          <span class="status-label">自动检测</span>
          <input type="checkbox" checked style="width: 16px; height: 16px;">
        </div>
        <div class="status-item">
          <span class="status-label">透明度</span>
          <input type="range" value="95" style="width: 100px;">
        </div>
        <div class="status-item">
          <span class="status-label">位置</span>
          <span class="status-badge info">右上角</span>
        </div>
      </div>
    </div>
    
    <div class="shortcuts">
      <h2>快捷键</h2>
      <div class="shortcut-grid">
        <div class="shortcut-item">
          <div class="shortcut-key">Cmd/Ctrl+Enter</div>
          <p class="shortcut-desc">显示/隐藏覆盖层</p>
        </div>
        <div class="shortcut-item">
          <div class="shortcut-key">Cmd/Ctrl+Shift+O</div>
          <p class="shortcut-desc">切换覆盖层</p>
        </div>
        <div class="shortcut-item">
          <div class="shortcut-key">Esc</div>
          <p class="shortcut-desc">隐藏覆盖层</p>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    // 简单的状态更新
    console.log('CheatGuard 主窗口已加载');
    console.log('按 Cmd/Ctrl+Enter 显示/隐藏覆盖层');
  </script>
</body>
</html>
