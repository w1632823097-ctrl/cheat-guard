<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* 关键：body 默认不响应鼠标事件，实现点击穿透 */
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: transparent;
      overflow: hidden;
      color: #e5e7eb;
      pointer-events: none;
      user-select: none;
    }

    /* 只有需要交互的元素才响应鼠标 */
    .overlay-card,
    .drag-handle,
    button,
    input {
      pointer-events: auto;
    }

    .overlay-container {
      width: 100%;
      height: 100vh;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .overlay-card {
      width: 100%;
      max-width: 400px;
      background: rgba(17, 24, 39, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(75, 85, 99, 0.5);
      border-radius: 12px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    /* 拖动区域 - 使用 -webkit-app-region: drag 让系统处理拖动 */
    .drag-handle {
      width: 100%;
      height: 32px;
      cursor: move;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 8px;
      background: rgba(17, 24, 39, 0.8);
      border-bottom: 1px solid rgba(75, 85, 99, 0.5);
      -webkit-app-region: drag;
      app-region: drag;
    }

    .drag-handle:hover {
      background: rgba(31, 41, 55, 0.9);
    }

    .drag-handle .drag-dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: #9ca3af;
    }

    .drag-handle .drag-text {
      font-size: 10px;
      color: #9ca3af;
      margin-left: 4px;
    }

    .overlay-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border-bottom: 1px solid rgba(75, 85, 99, 0.5);
    }

    .overlay-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #10b981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .overlay-title-text {
      font-size: 14px;
      font-weight: 600;
      color: #d1d5db;
    }

    .overlay-count {
      font-size: 12px;
      color: #6b7280;
    }

    .overlay-content {
      padding: 16px;
      min-height: 200px;
      max-height: 400px;
      overflow-y: auto;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
    }

    .empty-icon {
      width: 48px; height: 48px;
      margin: 0 auto 16px;
      background: rgba(55, 65, 81, 0.5);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-icon svg {
      width: 24px; height: 24px;
      color: #9ca3af;
    }

    .empty-text {
      font-size: 14px;
      color: #9ca3af;
      margin-bottom: 4px;
    }

    .empty-hint {
      font-size: 12px;
      color: #6b7280;
    }

    .response-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .response-item {
      background: rgba(31, 41, 55, 0.5);
      border: 1px solid rgba(75, 85, 99, 0.3);
      border-radius: 8px;
      padding: 12px;
    }

    .response-text {
      font-size: 13px;
      line-height: 1.6;
      color: #e5e7eb;
      margin-bottom: 8px;
    }

    .response-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid rgba(75, 85, 99, 0.3);
    }

    .confidence { font-size: 11px; color: #6b7280; }
    .timestamp { font-size: 11px; color: #4b5563; }

    .overlay-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-top: 1px solid rgba(75, 85, 99, 0.5);
    }

    .opacity-control {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .opacity-label {
      font-size: 11px;
      color: #9ca3af;
    }

    .opacity-slider {
      width: 80px;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: #4b5563;
      border-radius: 2px;
      outline: none;
    }

    .opacity-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #10b981;
      cursor: pointer;
    }

    .opacity-value {
      font-size: 11px;
      color: #d1d5db;
      min-width: 32px;
    }

    .status-info {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-indicator {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #10b981;
    }

    .status-text { font-size: 12px; color: #9ca3af; }

    .actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 4px 12px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
      -webkit-app-region: no-drag;
      app-region: no-drag;
    }

    .btn-clear {
      background: rgba(55, 65, 81, 0.5);
      color: #d1d5db;
    }
    .btn-clear:hover { background: rgba(75, 85, 99, 0.5); }

    .btn-toggle {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
    }
    .btn-toggle:hover { background: rgba(16, 185, 129, 0.3); }

    .btn-toggle.stop {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }
    .btn-toggle.stop:hover { background: rgba(239, 68, 68, 0.3); }

    .overlay-input-area {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-top: 1px solid rgba(75, 85, 99, 0.3);
    }

    .overlay-input {
      flex: 1;
      padding: 6px 10px;
      border: 1px solid rgba(75, 85, 99, 0.5);
      border-radius: 6px;
      background: rgba(31, 41, 55, 0.5);
      color: #e5e7eb;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
      pointer-events: auto;
    }

    .overlay-input::placeholder {
      color: #6b7280;
    }

    .overlay-input:focus {
      border-color: rgba(16, 185, 129, 0.5);
    }

    .btn-send {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 6px;
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s;
      pointer-events: auto;
      -webkit-app-region: no-drag;
      app-region: no-drag;
    }

    .btn-send:hover {
      background: rgba(16, 185, 129, 0.3);
    }
  </style>
</head>
<body>
  <div class="overlay-container">
    <div class="overlay-card">
      <!-- 拖动区域 -->
      <div class="drag-handle">
        <div class="drag-dot"></div>
        <div class="drag-dot"></div>
        <div class="drag-dot"></div>
        <span class="drag-text">拖动移动窗口</span>
      </div>

      <!-- 头部 -->
      <div class="overlay-header">
        <div class="overlay-title">
          <div class="status-dot"></div>
          <span class="overlay-title-text">CheatGuard AI</span>
        </div>
        <span class="overlay-count" id="responseCount">0 条提示</span>
      </div>

      <!-- 内容区域 -->
      <div class="overlay-content">
        <div class="empty-state" id="emptyState">
          <div class="empty-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3H5a2 2 0 00-2 2v4a2 2 0 002 2h2a2 2 0 002-2v-4z" />
            </svg>
          </div>
          <p class="empty-text">在下方输入框提问</p>
          <p class="empty-hint">或按 Cmd/Ctrl+Enter 触发 AI 提示</p>
        </div>
        <div class="response-list" id="responseList" style="display: none;"></div>
      </div>

      <!-- 输入区域 -->
      <div class="overlay-input-area">
        <input type="text" id="userInput" class="overlay-input" placeholder="输入问题..." />
        <button id="sendBtn" class="btn-send">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
          </svg>
        </button>
      </div>

      <!-- 底部 -->
      <div class="overlay-footer">
        <div class="opacity-control">
          <span class="opacity-label">透明度</span>
          <input type="range" id="opacitySlider" min="20" max="100" value="95" class="opacity-slider" />
          <span class="opacity-value" id="opacityValue">95%</span>
        </div>
        <div class="actions">
          <button class="btn btn-clear" id="clearBtn">清空</button>
          <button class="btn btn-toggle" id="toggleBtn">开始</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let isListening = false;
    let responses = [];

    const responseCount = document.getElementById('responseCount');
    const emptyState = document.getElementById('emptyState');
    const responseList = document.getElementById('responseList');
    const statusIndicator = document.getElementById('statusIndicator');
    const statusText = document.getElementById('statusText');
    const clearBtn = document.getElementById('clearBtn');
    const toggleBtn = document.getElementById('toggleBtn');

    function addResponse(text, confidence = 0.85) {
      responses.unshift({ id: Date.now(), text, confidence, timestamp: new Date() });
      if (responses.length > 10) responses.pop();
      updateUI();
    }

    function updateUI() {
      responseCount.textContent = `${responses.length} 条提示`;
      if (responses.length === 0) {
        emptyState.style.display = 'block';
        responseList.style.display = 'none';
      } else {
        emptyState.style.display = 'none';
        responseList.style.display = 'flex';
        responseList.innerHTML = responses.map(r => `
          <div class="response-item">
            <p class="response-text">${r.text}</p>
            <div class="response-meta">
              <span class="confidence">置信度: ${(r.confidence * 100).toFixed(0)}%</span>
              <span class="timestamp">${r.timestamp.toLocaleTimeString()}</span>
            </div>
          </div>
        `).join('');
      }
    }

    clearBtn.addEventListener('click', () => { responses = []; updateUI(); });

    toggleBtn.addEventListener('click', () => {
      isListening = !isListening;
      if (isListening) {
        toggleBtn.textContent = '停止';
        toggleBtn.classList.add('stop');
        statusText.textContent = '监听中...';
        statusIndicator.style.background = '#10b981';
        setTimeout(() => {
          if (isListening) addResponse('示例 AI 提示。在实际应用中，这里会显示 AI 生成的实时提示内容。');
        }, 2000);
      } else {
        toggleBtn.textContent = '开始';
        toggleBtn.classList.remove('stop');
        statusText.textContent = '就绪';
        statusIndicator.style.background = '#6b7280';
      }
    });

    if (window.require) {
      const { ipcRenderer } = window.require('electron');
      ipcRenderer.on('update-text', (event, text) => addResponse(text));
    }

    // 透明度调节
    const opacitySlider = document.getElementById('opacitySlider');
    const opacityValue = document.getElementById('opacityValue');

    opacitySlider.addEventListener('input', () => {
      const val = parseInt(opacitySlider.value);
      opacityValue.textContent = val + '%';
      if (window.require) {
        const { ipcRenderer } = window.require('electron');
        ipcRenderer.send('set-overlay-opacity', val / 100);
      }
    });

    updateUI();

    // 输入发送逻辑
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;
      addResponse(`[你]: ${text}`);
      userInput.value = '';
      // TODO: 这里后续对接 AI 接口
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
