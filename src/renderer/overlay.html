<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div class="window-wrapper">
    <!-- 工具条 -->
    <div class="toolbar" id="toolbar">
      <!-- Logo -->
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M2 12h20"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
      </div>

      <!-- Ask 按钮 -->
      <button class="ask-btn" id="askBtn">
        <svg class="sparkle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.937 15.5A2.766 2.766 0 0 1 8.5 17.062"/>
          <path d="M12 2a4.5 4.5 0 0 0 0 9 4.5 4.5 0 0 0 0-9z"/>
          <path d="M12 13c-3.866 0-7 3.134-7 7"/>
          <path d="M16 17a2 2 0 1 1-4 0"/>
          <path d="M20 2a2 2 0 1 1-4 0"/>
          <path d="M22 8a2 2 0 1 1-4 0"/>
        </svg>
        <span id="askText">Ask</span>
      </button>

      <!-- 录音按钮 -->
      <button class="record-btn" id="recordBtn" title="录音">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" x2="12" y1="19" y2="22"/>
        </svg>
      </button>

      <!-- 关闭按钮 -->
      <button class="close-btn" id="closeBtn" title="退出">
        <svg viewBox="0 0 24 24" fill="white">
          <rect x="5" y="5" width="14" height="14" rx="3"/>
        </svg>
      </button>
    </div>

    <!-- 咨询面板 -->
    <div class="chat-panel" id="chatPanel">
      <div class="panel-header">
        <!-- 透明度 -->
        <div class="opacity-control" id="opacityControl">
          <span class="opacity-label" id="opacityLabel">100%</span>
          <input type="range" id="opacitySlider" min="20" max="100" value="100" title="透明度">
        </div>
        <!-- 会话选择器 -->
        <div class="session-selector" id="sessionSelector">
          <button class="session-btn" id="sessionBtn" title="选择会话">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            <span id="sessionBtnLabel">新对话</span>
            <svg class="session-chevron" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="session-dropdown" id="sessionDropdown"></div>
        </div>
        <div class="panel-controls">
          <button class="new-session-btn" id="newSessionBtn" title="新建会话">+</button>
          <span class="panel-count" id="msgCount">0 条消息</span>
        </div>
      </div>

      <div class="chat-messages" id="chatMessages">
        <div class="empty-chat" id="emptyChat">
          <div class="empty-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 20.25c4.97 0 9-3.694 9-8.25s-4.03-8.25-9-8.25S3 7.444 3 12c0 2.104.859 4.023 2.273 5.48.432.447.74 1.04.586 1.641a4.483 4.483 0 0 1-.923 1.785A5.969 5.969 0 0 0 6 21c1.282 0 2.47-.402 3.445-1.087.81.22 1.668.337 2.555.337Z"/>
            </svg>
          </div>
          <p>在下方输入框提问</p>
          <span>AI 将为您提供实时帮助</span>
        </div>
        <div class="message-list" id="messageList" style="display: none;"></div>
        <!-- 转录文本展示区域 -->
        <div class="transcription-area" id="transcriptionArea" style="display: none;">
          <div class="transcription-header">
            <div class="recording-indicator">
              <div class="recording-dot"></div>
              <span>正在录音...</span>
            </div>
          </div>
          <div class="transcription-text" id="transcriptionText"></div>
        </div>
      </div>

      <div class="chat-input-area">
        <input type="text" class="chat-input" id="chatInput" placeholder="输入问题..." />
        <!-- 截图按钮 -->
        <button class="screenshot-btn" id="screenshotBtn" title="截图识别 (Ctrl+Shift+S)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="M21 15l-5-5L5 21"/>
          </svg>
        </button>
        <!-- 模型选择器 -->
        <div class="model-selector" id="modelSelector">
          <button class="model-btn" id="modelBtn" title="切换模型">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
              <line x1="8" x2="16" y1="21" y2="21"/>
              <line x1="12" x2="12" y1="17" y2="21"/>
            </svg>
          </button>
          <div class="model-dropdown" id="modelDropdown">
          </div>
        </div>
        <button class="send-btn" id="sendBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
